<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Study (Telugu)</title>
<style>
  body{font-family:system-ui,"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Nirmala UI",sans-serif;background:#f6f6f4;color:#222;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  #app{background:#fff;max-width:560px;width:92%;padding:32px;border-radius:12px;box-shadow:0 2px 12px #0001;text-align:center}
  .word{font-size:56px;margin:48px 0;line-height:1.3}
  button{font-size:18px;padding:12px 28px;border:0;border-radius:8px;background:#2b5fd9;color:#fff;cursor:pointer}
  button.opt{display:block;width:100%;margin:10px 0;background:#eef1f8;color:#222;font-size:26px}
  button.opt:hover{background:#dbe4fa}
  input{font-size:18px;padding:10px;width:80%;margin:8px 0}
  .small{color:#777;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== CONFIG ===================== */
// Paste your Google Apps Script web-app URL here (see apps-script.gs). Leave "" to only keep a CSV backup.
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbzqkksJ97yJ-vaU9WpUMe5W82pcRmzNAMjyucXGsVYkkaJQ1NRk5fkFsN_pTJbrbIYv/exec";
const LANGUAGE = "Telugu";
// word = real word, scrambled = scrambled form, options = 3 distractors (correct word is added at runtime)
const WORDS = [
 {
  "word": "ఉల్లిపాయ",
  "scrambled": "ఉపాల్లియ",
  "options": [
   "ఉల్లాసం",
   "ఉల్లిపొర",
   "ఉపాయం"
  ]
 },
 {
  "word": "దేవాలయం",
  "scrambled": "దేలవాయం",
  "options": [
   "విద్యాలయం",
   "గ్రంథాలయం",
   "దేవాదాయం"
  ]
 },
 {
  "word": "కళ్ళజోడు",
  "scrambled": "కజోళ్ళడు",
  "options": [
   "కాలిజోడు",
   "కళ్ళాపి",
   "కళ్ళెం"
  ]
 },
 {
  "word": "క్షమాపణ",
  "scrambled": "క్షపమాణ",
  "options": [
   "క్షమ",
   "ప్రార్థన",
   "అభ్యర్థన"
  ]
 },
 {
  "word": "ఆలోచన",
  "scrambled": "ఆచలోన",
  "options": [
   "ఆలాపన",
   "ఆరాధన",
   "ఆలింగనం"
  ]
 },
 {
  "word": "సమర్పించు",
  "scrambled": "సర్పింమచు",
  "options": [
   "సమర్థించు",
   "సంపాదించు",
   "సంభాషించు"
  ]
 },
 {
  "word": "నైపుణ్యం",
  "scrambled": "నైణ్యంపు",
  "options": [
   "నైర్మల్యం",
   "నైవేద్యం",
   "నైజం"
  ]
 },
 {
  "word": "కూరగాయలు",
  "scrambled": "కూగాయరలు",
  "options": [
   "కరపత్రాలు",
   "కొరతలు",
   "కూరపొడులు"
  ]
 },
 {
  "word": "అరటిపండు",
  "scrambled": "అపంరటిడు",
  "options": [
   "అరిటాకు",
   "మామిడిపండు",
   "అరవిందం"
  ]
 },
 {
  "word": "సంతోషం",
  "scrambled": "సంషంతో",
  "options": [
   "సంతాపం",
   "సంకోచం",
   "సంతృప్తి"
  ]
 },
 {
  "word": "నిజాయితీ",
  "scrambled": "నియిజాతీ",
  "options": [
   "నిబద్ధత",
   "నిర్మలత",
   "నిలకడ"
  ]
 },
 {
  "word": "స్వాగతం",
  "scrambled": "స్వాతంగ",
  "options": [
   "స్వగతం",
   "స్వభావం",
   "స్వాధీనం"
  ]
 },
 {
  "word": "పరీక్ష",
  "scrambled": "పక్షరీ",
  "options": [
   "ప్రతీక్ష",
   "సమీక్ష",
   "దీక్ష"
  ]
 },
 {
  "word": "నెమలి",
  "scrambled": "నెలిమ",
  "options": [
   "నెమరు",
   "నెలత",
   "కోయిల"
  ]
 },
 {
  "word": "దేవుడు",
  "scrambled": "దేడువు",
  "options": [
   "దేవత",
   "దేవర",
   "దేహం"
  ]
 }
];
const N_BASELINE = 5;      // words shown unscrambled (rest are scrambled)
/* ================================================== */

const app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const session = {pid:"", sid: Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
let rows = [];
let trials = [], pages = [], idx = 0, tStart = 0, hiddenMs = 0, hiddenAt = null;

document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt !== null) { hiddenMs += performance.now() - hiddenAt; hiddenAt = null; }
});

// Random baseline assignment per participant, so each word is baseline for some people and scrambled for others.
// There are N_BASELINE rounds. Every round has exactly 1 baseline word, plus the scrambled words shared out
// as evenly as possible (15 words -> 1+2 per round; fewer words -> some rounds have just 1+1). Order within a round is random.
function buildPages() {
  const items = shuffle(WORDS);
  const base = items.slice(0, N_BASELINE);
  const scr = items.slice(N_BASELINE);
  const counts = Array(N_BASELINE).fill(Math.floor(scr.length / N_BASELINE));
  for (let i = 0; i < scr.length % N_BASELINE; i++) counts[i]++;
  const rounds = [];
  let si = 0;
  shuffle(counts).forEach((c, r) => {
    const round = [{...base[r], baseline: true}];
    for (let k = 0; k < c; k++) round.push({...scr[si++], baseline: false});
    rounds.push(shuffle(round));
  });
  trials = [];
  pages = [];
  rounds.forEach(rt => {
    rt.forEach(t => { t.shown = t.baseline ? t.word : t.scrambled; t.order = trials.length + 1; trials.push(t); });
    rt.forEach((t, k) => pages.push({kind:"word", t, pos:k+1}));
    rt.forEach((t, k) => pages.push({kind:"question", t, pos:k+1}));
  });
}

function start() {
  app.innerHTML = `
    <h2>Reading Study</h2>
    <p>You will see one word per page. Read the word and click <b>Next</b> as soon as you have read it.
    After ${WORDS.length === 3 * N_BASELINE ? "three words" : "a few words"}, you will be asked to pick each word you saw from four options.
    Please do not go back or switch tabs.</p>
    <p><input id="pid" placeholder="Participant ID"></p>
    <p><button id="go">Start</button></p>`;
  document.getElementById("go").onclick = () => {
    session.pid = document.getElementById("pid").value.trim();
    if (!session.pid) return alert("Please enter your participant ID.");
    buildPages(); idx = 0; show();
  };
}

const elapsed = () => (performance.now() - tStart - hiddenMs) / 1000;
const tooSoon = () => performance.now() - tStart < 300;   // ignore accidental double-clicks

function show() {
  if (idx >= pages.length) return finish();
  const p = pages[idx];
  hiddenMs = 0; hiddenAt = document.hidden ? performance.now() : null;
  if (p.kind === "word") {
    app.innerHTML = `<div class="small">Word ${p.pos}</div><div class="word">${p.t.shown}</div><button id="next">Next</button>`;
    tStart = performance.now();
    document.getElementById("next").onclick = () => {
      if (tooSoon()) return;
      p.t.timeWord = elapsed(); idx++; show();
    };
  } else {
    const opts = shuffle([p.t.word, ...p.t.options]);
    app.innerHTML = `<h3>What was word ${p.pos}?</h3>` + opts.map(o => `<button class="opt" data-v="${o}">${o}</button>`).join("");
    tStart = performance.now();
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (tooSoon()) return;
      p.t.timeChoice = elapsed(); p.t.chosen = b.dataset.v; idx++; show();
    });
  }
}

const r3 = x => Math.round(x * 1000) / 1000;

async function finish() {
  const ts = new Date().toISOString();
  rows = trials.map(t => ({
    participant: session.pid,
    word: t.word,
    scrambled_form: t.baseline ? "" : t.scrambled,
    time_choosing_option_s: r3(t.timeChoice),
    time_on_word_s: r3(t.timeWord),
    is_baseline: t.baseline ? 1 : 0,
    chose_correct: t.chosen === t.word ? 1 : 0,
    chosen_option: t.chosen,
    trial_order: t.order,
    language: LANGUAGE,
    session_id: session.sid,
    timestamp: ts
  }));
  try { localStorage.setItem("jumble_" + LANGUAGE + "_" + session.sid, JSON.stringify(rows)); } catch(e) {}
  app.innerHTML = `<h2>Thank you!</h2><p id="status">Saving your responses…</p>`;
  let status = "Responses saved on this device only.";
  if (SUBMIT_URL) {
    try {
      await fetch(SUBMIT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(rows)});
      status = "Your responses have been submitted.";
    } catch (e) { status = "Could not submit automatically. Please download the file below and send it to the researchers."; }
  }
  document.getElementById("status").textContent = status;
  const cols = Object.keys(rows[0]);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = "﻿" + [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  app.insertAdjacentHTML("beforeend", `<p><a download="${session.pid}_${LANGUAGE}_${session.sid}.csv" href="${url}">Download backup CSV</a></p>`);
}

start();
</script>
</body>
</html>
